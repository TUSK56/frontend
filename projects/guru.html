<script src="../assets/projects.js"></script>
<script>
(function(){
  "use strict";
  var SLUG = "guru";
  var DATA = (window.AV_PROJECTS || {})[SLUG];
  if(!DATA) return;

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pad = function(n){ return (n<10?"0":"") + n; };
  var src = function(n, thumb){ return "../assets/projects/" + SLUG + "/" + pad(n) + (thumb?"-t":"") + ".webp"; };

  document.querySelector("[data-year]").textContent = new Date().getFullYear();
  document.querySelector("[data-intro]").textContent = DATA.intro || "";
  document.querySelector("[data-place-count]").textContent =
    DATA.locations.length + (DATA.locations.length === 1 ? " location" : " locations");

  /* ---------- header ---------- */
  var menuBtn = document.querySelector(".menu-btn"), menu = document.getElementById("mobile-menu");
  function setMenu(o){
    menuBtn.setAttribute("aria-expanded", String(o));
    menuBtn.setAttribute("aria-label", o ? "Close menu" : "Open menu");
    menu.dataset.open = String(o);
    document.body.style.overflow = o ? "hidden" : "";
  }
  menuBtn.addEventListener("click", function(){ setMenu(menuBtn.getAttribute("aria-expanded") !== "true"); });
  menu.addEventListener("click", function(e){ if(e.target.closest("a")) setMenu(false); });

  var bar = document.querySelector(".progress"), tick = false;
  window.addEventListener("scroll", function(){
    if(tick) return; tick = true;
    requestAnimationFrame(function(){
      var hh = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = "scaleX(" + (hh > 0 ? window.scrollY / hh : 0) + ")";
      tick = false;
    });
  }, {passive:true});

  /* ---------- location cards ---------- */
  var list = document.querySelector("[data-locations]");
  DATA.locations.forEach(function(loc, i){
    var li = document.createElement("li");
    var b  = document.createElement("button");
    b.type = "button";
    b.className = "place";
    b.setAttribute("aria-haspopup", "dialog");
    b.setAttribute("aria-label", loc.name + (loc.city ? ", " + loc.city : "") +
                   " — open " + loc.frames.length + " images");
    b.innerHTML =
      '<img src="' + src(loc.frames[0], false) + '" alt="" loading="lazy" decoding="async">' +
      '<span class="place-scrim" aria-hidden="true"></span>' +
      '<span class="place-index"><b>' + pad(i+1) + '</b> &middot; ' + pad(loc.frames.length) + ' frames</span>' +
      '<span class="place-label">' +
        '<span class="place-name"></span>' +
        (loc.city ? '<span class="place-city"></span>' : '') +
        '<span class="place-open">Open photos &rarr;</span>' +
      '</span>';
    b.querySelector(".place-name").textContent = loc.name;
    if(loc.city) b.querySelector(".place-city").textContent = loc.city + (loc.year ? " · " + loc.year : "");
    b.addEventListener("click", function(){ openLb(loc, b); });
    li.appendChild(b);
    list.appendChild(li);
  });

  /* ---------- reveals ---------- */
  var reveals = document.querySelectorAll("[data-reveal]");
  if(reduce || !("IntersectionObserver" in window)){
    reveals.forEach(function(el){ el.classList.add("is-in"); });
  } else {
    var io = new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add("is-in"); io.unobserve(x.target); } });
    }, {rootMargin:"0px 0px -12% 0px", threshold:0.08});
    reveals.forEach(function(el){ io.observe(el); });
  }

  /* ---------- lightbox, scoped to the chosen location ---------- */
  var lb = document.getElementById("lightbox"), lbPanel = lb.querySelector(".lb-panel"),
      lbImg = lb.querySelector("[data-lb-img]"), lbSub = lb.querySelector("[data-lb-sub]"),
      lbCount = lb.querySelector("[data-lb-count]"), lbRail = lb.querySelector("[data-lb-rail]"),
      lbClose = lb.querySelector(".lb-close");
  var frames = [], idx = 0, trigger = null, label = "";
  var bg = [document.querySelector(".site-head"), document.getElementById("main"),
            document.querySelector(".site-foot"), menu];

  function inert(on){
    bg.forEach(function(el){
      if(!el) return;
      if(on){ el.setAttribute("inert",""); el.setAttribute("aria-hidden","true"); }
      else  { el.removeAttribute("inert"); el.removeAttribute("aria-hidden"); }
    });
  }
  function pre(i){ if(i < 0 || i >= frames.length) return; var im = new Image(); im.src = src(frames[i], false); }

  function show(i, dir){
    idx = (i + frames.length) % frames.length;
    lbImg.classList.remove("is-shown");
    lbImg.style.setProperty("--from", dir === -1 ? "-24px" : "24px");
    var nx = new Image();
    nx.onload = function(){
      lbImg.src = nx.src;
      lbImg.alt = label + ", image " + (idx+1) + " of " + frames.length;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ lbImg.classList.add("is-shown"); }); });
    };
    nx.src = src(frames[idx], false);
    lbCount.innerHTML = "<b>" + pad(idx+1) + "</b> / " + pad(frames.length);
    Array.prototype.forEach.call(lbRail.children, function(b, n){
      b.setAttribute("aria-selected", String(n === idx));
      if(n === idx && b.scrollIntoView) b.scrollIntoView({block:"nearest", inline:"center", behavior: reduce ? "auto" : "smooth"});
    });
    pre(idx+1); pre(idx-1);
  }

  function openLb(loc, el){
    frames = loc.frames.slice();
    label = loc.name;
    trigger = el;
    lbSub.textContent = (DATA.scope || "") + (loc.city ? " · " + loc.city : "");
    lbRail.innerHTML = "";
    frames.forEach(function(f, n){
      var t = document.createElement("button");
      t.type = "button"; t.setAttribute("role","tab"); t.setAttribute("aria-label","Image " + (n+1));
      var im = document.createElement("img"); im.src = src(f, true); im.alt = ""; im.loading = "lazy";
      t.appendChild(im);
      t.addEventListener("click", function(){ show(n, n > idx ? 1 : -1); });
      lbRail.appendChild(t);
    });
    lb.hidden = false;
    if(!reduce && el){
      var r = el.getBoundingClientRect();
      lbPanel.style.transformOrigin = ((r.left + r.width/2) / innerWidth * 100) + "% " +
                                      ((r.top + r.height/2) / innerHeight * 100) + "%";
    }
    document.body.style.overflow = "hidden";
    inert(true);
    show(0, 1);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ lb.classList.add("is-open"); }); });
    lbClose.focus();
  }

  function close(){
    if(lb.hidden) return;
    lb.classList.remove("is-open");
    var done = function(){
      lb.hidden = true; document.body.style.overflow = ""; inert(false);
      if(trigger) trigger.focus(); trigger = null;
    };
    reduce ? done() : setTimeout(done, 200);
  }

  lbClose.addEventListener("click", close);
  lb.querySelector("[data-close]").addEventListener("click", close);
  lb.querySelector(".lb-prev").addEventListener("click", function(){ show(idx-1, -1); });
  lb.querySelector(".lb-next").addEventListener("click", function(){ show(idx+1, 1); });

  document.addEventListener("keydown", function(e){
    if(lb.hidden){ if(e.key === "Escape") setMenu(false); return; }
    if(e.key === "Escape"){ e.preventDefault(); close(); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx-1, -1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); show(idx+1, 1); }
    else if(e.key === "Home"){ e.preventDefault(); show(0, -1); }
    else if(e.key === "End"){ e.preventDefault(); show(frames.length-1, 1); }
    else if(e.key === "Tab"){
      var f = lb.querySelectorAll("button"); if(!f.length) return;
      var a = f[0], z = f[f.length-1];
      if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
      else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
    }
  });

  (function(){
    var x0 = null, y0 = null;
    lb.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
    lb.addEventListener("touchend", function(e){
      if(x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.5) show(idx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
      x0 = null; y0 = null;
    }, {passive:true});
  })();
})();
</script>
</body>
</html>
